# Hulk profile: Senang Homes (real estate).
# Everything that is NOT a secret lives here. Secrets go in scripts/.env.
# Run any script against this profile with:  --profile senang-homes

name: Senang Homes
mode: property          # property = spreadsheet-driven listings. (tansri-millionaires uses mode: topic)
persona: persona.md
playbook: playbook.md
templates_dir: templates

# Which .env credential names this profile posts with. Two brands = two Threads/IG accounts,
# so each profile names its own variables and they never get crossed.
credentials:
  threads_user_id: SENANG_THREADS_USER_ID
  threads_access_token: SENANG_THREADS_ACCESS_TOKEN
  ig_user_id: SENANG_IG_USER_ID
  ig_access_token: SENANG_IG_ACCESS_TOKEN

listings:
  # Where the property spreadsheet comes from. One of:
  #   csv    — local .csv file
  #   xlsx   — local Excel file (needs `openpyxl`)
  #   gsheet — a Google Sheet published/exported as CSV (see scripts/README.md)
  source: gsheet
  # The real listings sheet: 23 new-development projects, one row per unit type (93 rows).
  # Set via SENANG_HOMES_LISTINGS_URL in .env / GitHub secrets instead of hardcoding here, so
  # the URL doesn't sit in git (common.load_config reads that env var automatically).
  url: ""
  # Only rows whose `status` column matches one of these are eligible to post. This sheet has
  # no status column, so `status` is left unmapped below — common.active_listings() treats a
  # blank status as always-active, so every row is eligible by default.
  active_statuses: [active, available, "for sale", "for rent"]

  # Map YOUR spreadsheet's column headers to the fields the agent uses.
  # Left = agent field, right = your column header (case-insensitive, spaces ok).
  # Any field you don't have: leave the value empty and the agent writes around it.
  columns:
    ref: ""                       # this sheet has no unique-id column — common.py derives a
                                   # stable one from title + size instead (see load_listings()).
    title: "Project Name"
    type: "Land Title"            # e.g. Residential (Condominium)
    deal: ""                      # every row here is a developer new-project sale; no column for it
    location: "Location"
    price: "Nett Price"
    size: "Size (sqft)"
    bedrooms: ""                  # not a clean separate column — see unit_type below
    bathrooms: ""
    unit_type: "Unit Type"        # e.g. "Type A (3+1R 3+1B)" — room counts when present, in prose
    developer: "Developer"
    completion_status: "Completion Status"   # e.g. Under-con / Completed
    expected_vp: "Expected VP (Q/Y)"         # vacant possession date estimate
    tenure: "Tenure"              # freehold / leasehold
    monthly_instalment: "Monthly Installment 3.8%"
    loan_amount: "90% Loan Amount"
    monthly_rental_estimate: "Monthly Rental (Est./Current)"
    rental_yield: ""              # no yield % column, only a rental estimate above
    legal_fees_freebies: "Legal Fees & Freebies"
    highlight: "Rebates & Discount"   # the one line that makes this property interesting
    image_url: "Image URL"        # publicly reachable image, optional — not in this sheet yet
    status: ""

poster:
  # Every post gets an image. Instagram REQUIRES one; on Threads it lifts reach.
  #   auto   — make_poster.py renders a PNG locally from the listing row (works in cron, no network)
  #   canva  — a Claude session generates it through the Canva connector (richer, not cron-able)
  #   sheet  — use the row's Image URL column as-is, skip generation
  #   none   — text-only posts (Instagram will then be skipped)
  mode: auto
  # Used by mode: auto. Colours are the Senang Homes palette — change them here.
  background: "#0E1A16"
  accent: "#14B87A"
  text: "#F5F7F6"
  muted: "#8FA39B"
  brand: "SENANG HOMES"
  size: [1080, 1350]        # 4:5 — the tallest ratio Instagram shows in full
  # Posters render to scripts/posters/, which daily_posts.py commits + pushes (see
  # commit_poster()) so Threads/Instagram can fetch it from here — see scripts/README.md.
  public_base_url: "https://raw.githubusercontent.com/srithesigan98/SocialMediaAgents/main/agents/hulk/scripts/posters"

schedule:
  # Two posts a day, as asked. Times are local to the machine running the scheduler.
  posts_per_day: 2
  times: ["09:30", "19:30"]
  # Don't repost the same property until this many days have passed.
  cooldown_days: 14
  # Post to these platforms. Remove one to disable it.
  platforms: [threads, instagram]

whatsapp:
  # Your closing number in full international format, digits only (no +, no spaces).
  # e.g. Malaysia 011-1234 5678 -> 601112345678
  number: "60169559848"
  # Prefilled message — states buying intent explicitly so the agent knows why they're texting.
  # {ref} and {title} are substituted per property; {ref} is left out here since it's now an
  # auto-generated slug (e.g. "the-lantern-bangsar-570"), not a customer-facing code.
  prefill: "Hi, I'm interested to buy {title}. Can you send me the full pricing and details?"
  # The CTA line appended verbatim to every post. {link} is the wa.me URL.
  cta_template: "Full details + floor plan on WhatsApp 👉 {link}"

replies:
  # Auto-reply to every comment on a Hulk Estate post.
  enabled: true
  # Threads has no public DM API, so Threads replies are public (the wa.me link is in the reply).
  # Instagram supports a real private DM reply — that's the ManyChat-style behaviour.
  instagram_private_reply: true
  instagram_public_reply: true
  threads_public_reply: true
  # Never reply twice to the same comment; never reply to your own comments.
  skip_own_comments: true
  # Only look at posts from the last N days (Instagram private replies expire after 7 days).
  lookback_days: 7
  # Keyword → reply intent. First match wins; `default` is used when nothing matches.
  intents:
    price:
      keywords: [price, harga, how much, berapa, cost, rm]
      reply: "{name} it's {price} for {title} — {size_line}. Full breakdown + instalment on WhatsApp 👉 {link}"
    loan:
      keywords: [loan, financing, instalment, installment, ansuran, mortgage, deposit, downpayment]
      reply: "{name} happy to run the loan + down payment numbers for {ref} with you. Send me your details here 👉 {link}"
    viewing:
      keywords: [view, viewing, visit, appointment, tengok, survey]
      reply: "{name} viewings are open this week for {title}. Pick a slot with me here 👉 {link}"
    availability:
      keywords: [available, still, sold, rented, ada lagi]
      reply: "{name} yes — {ref} is still {status}. Grab the full details before it moves 👉 {link}"
    default:
      keywords: []
      reply: "{name} thanks for the interest in {title} ({ref}) — sending you the full details, floor plan and pricing here 👉 {link}"
