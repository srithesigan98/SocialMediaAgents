  caption: '4 MRTA myths most home buyers believe 👇


    Myth: MRTA pays cash to your family.

    Fact: MRTA mainly pays the bank, to reduce or clear your loan. With MLTA, money left after the loan usually goes to you or your nominee.


    Myth: Your cover stays the same.

    Fact: MRTA cover shrinks on a schedule set when you sign. MLTA stays level.


    Myth: Fire insurance protects your loan.

    Fact: It covers the building. If you die or become totally and permanently disabled, MRTA or MLTA can pay some or all of the loan.


    Myth: MRTA is required by law.

    Fact: It isn''t, but your bank can make mortgage cover a loan condition.


    Takaful versions: MRTT and MLTT.

    Who gets paid depends on your policy owner, assignment and nominee. Check your PDS.


