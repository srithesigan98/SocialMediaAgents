# Khaya Residences focus campaign — slides for a feature carousel.
# Facts come from the developer brief supplied by the agent (Sep 2026); {placeholders} are filled
# at render time from the live Google Sheet rows for this project, so prices never go stale.
project: Khaya Residences
trigger_word: KHAYA

facts:   # given to the caption writer as the only allowed claims
  - Airbnb allowed; near Pantai Hospital
  - Type C and Type D units are the Airbnb-suited layouts
  - Commercial title (HTA)
  - Nearest LRT stations Abdullah Hukum and Kerinchi, Kelana Jaya Line
  - 18,000 sqft for Anytime Fitness and a grocery store
  - 9 ground-level shoplot units
  - 3.88 acres, 61 floors; levels 10 to 59 are residential floors
  - 10 lifts in total
  - 90% of units have an unblocked view of KL city and the TNB tower
  - Same landscape architect as TRX (Land Art)

# Reels, posted in this order. Hosted as assets on the repo's "khaya-reels" GitHub release (too big
# for git) — Meta fetches them by URL. Captions never state a starting price: the videos have
# "FROM RM 785,000*" burned in, which differs from the sheet's nett prices.
reel_base_url: https://github.com/srithesigan98/SocialMediaAgents/releases/download/khaya-reels
reels:
  - {file: Khaya_Unit_B_High_Motion.mp4, angle: "Unit B walkthrough — contemporary luxury interior"}
  - {file: Khaya_Unit_A_Featured.mp4, angle: "Unit A featured tour"}
  - {file: Khaya_Unit_C_High_Motion.mp4, angle: "Unit C walkthrough — Scandinavian zen interior"}
  - {file: Khaya_Luxury_Reel_Voiceover_Music.mp4, angle: "Luxury overview of the showroom unit"}
  - {file: Khaya_Unit_B_Tour.mp4, angle: "Full Unit B tour, room by room"}
  - {file: Khaya_High_Motion_Viral_Reel.mp4, angle: "Fast-paced first look at Khaya"}
  - {file: Khaya_Unit_C_Tour.mp4, angle: "Full Unit C tour, room by room"}
  - {file: Khaya_Master_Highlight_Reel.mp4, angle: "Highlights: kitchen, master suite, spa bathroom"}
  - {file: Khaya_Unit_A_Tour.mp4, angle: "Full Unit A tour, room by room"}

location: Bangsar
series: Khaya Residences   # top-left series label on every slide

# Carousel in the premium editorial style (magazine.py): cover -> context -> 6 main ideas ->
# takeaway -> checklist + CTA. Two-part headlines: `headline` in bold sans, `italic` in serif.
# Every claim is one of the facts above; {placeholders} come from the live sheet.
slides:
  - layout: cover
    photo: tower.jpg
    label: Khaya Residences · Bangsar
    headline: A new address
    italic: in Bangsar
    subtitle: Ten things to know before your viewing.
    sticker: Airbnb allowed
  - layout: statement
    photo: pool.jpg
    label: Why it matters
    headline: Built for living,
    italic: and for short stays
    body: Khaya allows Airbnb, sits near Pantai Hospital and close to two LRT stations. Here's what that means when you're choosing a unit.
    takeaway: Permitted use and location are worth checking on any purchase.
  - layout: bignumber
    photo: tower.jpg
    label: The building
    headline: Tall, with
    italic: room to breathe
    number: "61"
    caption: Floors on 3.88 acres. Residences from level 10 to level 59.
    takeaway: 10 lifts serve the tower.
  - layout: arch
    photo: living.jpg
    label: Short stays
    headline: Airbnb
    italic: allowed
    body: Type C and Type D are the layouts suited to short stays. Commercial title (HTA).
    aside: Near Pantai Hospital.
    takeaway: Ask which units are Type C and Type D when you view.
  - layout: list
    photo: aerial.jpg
    label: Getting around
    headline: Two LRT stations,
    italic: one line
    items:
      - {title: "Abdullah Hukum", line: "Kelana Jaya Line"}
      - {title: "Kerinchi", line: "Kelana Jaya Line"}
    takeaway: Both stations are on the Kelana Jaya Line.
  - layout: photo
    photo: view.jpg
    label: The view
    headline: 90% of units,
    italic: unblocked
    body: Views of the Kuala Lumpur city skyline and the TNB tower.
    takeaway: Floor and facing decide the view — ask for both.
  - layout: compare
    photo: terrace.jpg
    label: Choose your size
    headline: Smallest to
    italic: largest
    compare:
      - {label: "Entry unit", value: "{min_size} sqft", lines: ["From {from_price}"]}
      - {label: "Largest unit", value: "{max_size} sqft", lines: ["Up to {max_price}"]}
    takeaway: "{unit_count} unit types to choose from."
  - layout: list
    photo: model.jpg
    label: On site
    headline: Daily needs,
    italic: downstairs
    items:
      - {title: "9 shoplots", line: "On the ground level"}
      - {title: "18,000 sqft for daily needs", line: "Anytime Fitness and a grocery store"}
      - {title: "Landscape by Land Art", line: "The team behind TRX's landscape"}
    takeaway: Everyday errands without leaving the building.
  - layout: statement
    photo: interior.jpg
    label: Pricing
    headline: "From {from_price},"
    italic: "{psf_min} per sqft"
    body: "{rebate}. Based on current listed units; prices and availability can change."
    takeaway: Compare price per sqft, not just the headline price.
  - layout: checklist
    label: Save this
    headline: Khaya
    italic: at a glance
    items:
      - "Airbnb allowed — Type C and Type D"
      - "Near Pantai Hospital"
      - "Abdullah Hukum and Kerinchi LRT"
      - "90% of units with unblocked views"
      - "61 floors, 10 lifts, 3.88 acres"
      - "From {from_price}"
    cta: 'Comment "KHAYA" for full details'
