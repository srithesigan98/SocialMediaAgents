  instagram: |-
    Your salary looks fine. So why did the bank say no? Usually, it's one number: your DSR 👇

    Debt service ratio = your monthly debts ÷ your net income (after EPF and tax).

    Illustration, RM5,000 net a month:
    • Car loan RM800 + PTPTN RM200 + new home loan RM2,000 = RM3,000 → 60%
    • A credit card you pay in full may still count. Add RM500 → 70%
    • Cancel that card and clear the car loan → the same home is 44%

    Good to know:
    • Each bank sets its own limit, and may also check what's left after your debts.
    • To bring it down, cancel cards you don't use and clear small loans before you apply.

    Illustration only. Each bank assesses differently; this isn't a loan approval.

    Comment "DSR" and we'll work out your number before you view.

