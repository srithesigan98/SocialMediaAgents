    The price says RM500K. Here's what goes on top 👇

    Down payment: banks usually lend 90%, so you bring 10%. RM50,000.
    Legal fees (sale agreement + loan), on a fixed scale: RM6,250 + RM5,625.
    Stamp duty: RM9,000 on the transfer, 0.5% of the loan = RM2,250.
    That's RM73,125 before you move in, then furnishing, renovation and utility deposits.

    First home at RM500K or less? If you qualify, both stamp duties can be waived (until 31 Dec 2027).
    New launch? Many cover your legal fees. Ask what the package includes.

