  instagram: |-
    Same street, two condos. One is freehold, one is leasehold. What changes for you? 👇

    • Freehold has no end date.
    • Leasehold is a lease from the state, often for 99 years.
    • When the lease runs out, the land goes back to the state, unless it's renewed.
    • Renewal isn't automatic: you apply before it ends and pay a premium the state sets. Each state has its own rules and rates.

    Illustration: 35 years left on the lease. Some banks may lend less, or for fewer years.

    Also good to know:
    • Some titles need state consent to sell or refinance, which can add weeks or months.
    • Leasehold is often priced lower than a similar freehold nearby.

    Before you buy, check the title: the tenure, the years left, and any restriction.

    General info only, not legal advice. Rules vary by state and each bank sets its own policy.

    Comment "TITLE" and we'll check a unit's tenure and years left for you.
