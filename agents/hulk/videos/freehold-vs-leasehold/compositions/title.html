    const reveal = (sel, t, d = 0.6) => tl.fromTo(sel, { clipPath: "inset(-10% 100% -10% 0)" }, { clipPath: "inset(-10% 0% -10% 0)", duration: d, ease: "power2.inOut", immediateRender: false }, t);

      tl.set("#v1", { textContent: fh ? "Freehold" : "Leasehold" }, t + 0.1);
      reveal("#v1", t + 0.1, 0.35);
    };
    const ring = (yrs, t, d = 0.9) => tl.to("#ring", { strokeDashoffset: 804.25 * (1 - yrs / 99), duration: d, ease: "power2.inOut" }, t);
    const swap = (sel, text, t, d = 0.45) => { tl.set(sel, { textContent: text }, t); tl.set(sel === "#v3a" ? "#v3" : sel, { color: "#142E2B" }, t); reveal(sel === "#v3a" ? "#v3" : sel, t, d); };

    flip("lh", 3.33);                               // "leasehold"
    pulse("#v2, #v3, #v4", 4.21, 1.15);                  // "What changes"
    // freehold / leasehold
    flip("fh", 6.17);                                // "Freehold"
    swap("#v2", "No end date", 6.95);                      // "no end date"
    flip("lh", 8.19);                               // "Leasehold"
    swap("#v2", "Lease from state", 8.19);             // "a lease from the state"
    ring(0, 9.76, 0.3); count("#cnum", 99, 0, 9.76, 0.3);
    ring(99, 10.79, 0.8); count("#cnum", 0, 99, 10.79, 0.8);   // "often for 99 years"

    pop("#renew", 15.69);                               // "unless it's renewed"
    ring(99, 16.22, 0.8); count("#cnum", 0, 99, 16.22, 0.8);
