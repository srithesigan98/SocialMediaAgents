name: Hulk (Senang Homes) comment replies

# Answers every new comment on the last 7 days of Senang Homes posts — the "comment KHAYA for
# full details" promise on the posters. Threads: public reply with the WhatsApp link (Threads has
# no DM API). Instagram: private DM + public reply. Already-answered comment ids are committed
# to state/senang-homes-replied.json so no comment is answered twice.

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs a few minutes under load
  workflow_dispatch: {}

concurrency:
  group: hulk-senang-homes-replies   # never two runs answering the same comments at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/hulk/scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r agents/hulk/scripts/requirements.txt
      - name: Answer new comments
        env:
          SENANG_THREADS_USER_ID: ${{ secrets.SENANG_THREADS_USER_ID }}
          SENANG_THREADS_ACCESS_TOKEN: ${{ secrets.SENANG_THREADS_ACCESS_TOKEN }}
          SENANG_IG_USER_ID: ${{ secrets.SENANG_IG_USER_ID }}
          SENANG_IG_ACCESS_TOKEN: ${{ secrets.SENANG_IG_ACCESS_TOKEN }}
          SENANG_HOMES_LISTINGS_URL: ${{ secrets.SENANG_HOMES_LISTINGS_URL }}
        run: cd agents/hulk/scripts && python reply_bot.py --profile senang-homes
      - name: Save answered comments
        if: always()
        run: |
          git config user.name "hulk-bot"
          git config user.email "hulk-bot@users.noreply.github.com"
          git add agents/hulk/scripts/state/senang-homes-replied.json
          git diff --cached --quiet && exit 0
          git commit -m "hulk: senang-homes replied comments"
          git pull --rebase origin main
          git push origin HEAD:main
