name: Blue Hulk daily post

# Generates one on-brand Facebook post and publishes it, once a day.
# Fully automatic (no review). Runs on GitHub's servers — free, no computer needed.
#
# Daily duty rules (see agents/blue-hulk/scripts/README.md "Daily duty rules"):
#   1. Posts every day, no matter what.
#   2. 1 out of every 4 posts is a Striker Zones post with a CTA to
#      https://t.me/strikerzonesadmin_bot.
#   3. 1 out of every 3 posts should carry a Canva poster. See "Automating Canva posters
#      (rule 3)" in the same README. The CANVA_* secrets below are optional and safe to leave
#      unset — poster days fall back to text-only until they're configured.

on:
  schedule:
    # 12:30 UTC = 8:30pm Malaysia (UTC+8). Cron is always UTC; change this to reschedule.
    # GitHub may start scheduled runs a few minutes late under load — that's normal.
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r agents/blue-hulk/scripts/requirements.txt
      - name: Generate and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Optional — enables rule 3 (Canva posters) once set up; safe to leave unset for now.
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          CANVA_BRAND_TEMPLATE_ID: ${{ secrets.CANVA_BRAND_TEMPLATE_ID }}
        run: python agents/blue-hulk/scripts/daily_post.py
