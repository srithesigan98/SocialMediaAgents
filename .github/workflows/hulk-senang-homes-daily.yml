name: Hulk (Senang Homes) daily post

# ONE post a day at 19:30 MYT (11:30 UTC) to Threads + Instagram. What goes out depends on the day:
#   Monday    — weekly recap carousel of the last 7 days' listings (weekly_posts.py --recap)
#   Thursday  — off-sheet buyer tip, e.g. "rental yield in 10 seconds" (weekly_posts.py --tip)
#   other days — odd days: a focus project (Khaya / One Seputeh); even days: the rest of the sheet.
# Fully automatic (no review). Runs on GitHub's servers — free, no computer needed.
# Manual "Run workflow": leave campaign blank for the normal schedule, or pick one to post its
# carousel now (optionally to one platform only — e.g. to finish a post that failed on one side).

on:
  schedule:
    - cron: "30 11 * * *"   # GitHub may start scheduled runs a few minutes late under load
  workflow_dispatch:
    inputs:
      campaign:
        description: "Post this campaign's carousel now (blank = normal schedule)"
        type: choice
        options: ["", khaya, oneseputeh]
        default: ""
      platform:
        description: "Only this platform (with a campaign)"
        type: choice
        options: [both, threads, instagram]
        default: both

permissions:
  contents: write   # needed to commit/push each post's poster (see commit_poster())

jobs:
  post:
    runs-on: ubuntu-latest   # ships with ffmpeg, which the animated posters need
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r agents/hulk/scripts/requirements.txt
      - name: Configure git identity (for poster commits)
        run: |
          git config user.name "hulk-bot"
          git config user.email "hulk-bot@users.noreply.github.com"
      - name: Generate and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENANG_THREADS_USER_ID: ${{ secrets.SENANG_THREADS_USER_ID }}
          SENANG_THREADS_ACCESS_TOKEN: ${{ secrets.SENANG_THREADS_ACCESS_TOKEN }}
          SENANG_IG_USER_ID: ${{ secrets.SENANG_IG_USER_ID }}
          SENANG_IG_ACCESS_TOKEN: ${{ secrets.SENANG_IG_ACCESS_TOKEN }}
          SENANG_HOMES_LISTINGS_URL: ${{ secrets.SENANG_HOMES_LISTINGS_URL }}
          CAMPAIGN: ${{ inputs.campaign }}   # via env, never interpolated into the script
          PLATFORM: ${{ inputs.platform }}
        run: |
          cd agents/hulk/scripts
          if [ -n "$CAMPAIGN" ]; then
            if [ "$PLATFORM" = both ] || [ -z "$PLATFORM" ]; then
              python campaign_post.py "$CAMPAIGN" --profile senang-homes --yes
            else
              python campaign_post.py "$CAMPAIGN" --profile senang-homes --platform "$PLATFORM" --yes
            fi
            exit
          fi
          # Focus projects (profile.yaml focus_campaigns: Khaya + One Seputeh, equal priority) get
          # every other day; the other days rotate the rest of the sheet with them excluded.
          DOW=$(date -u +%u)                  # 1 = Monday ... 7 = Sunday
          ODD_DAY=$(( 10#$(date -u +%j) % 2 ))
          if [ "$DOW" = 1 ]; then
            python weekly_posts.py --profile senang-homes --recap --yes
          elif [ "$DOW" = 4 ]; then
            python weekly_posts.py --profile senang-homes --tip --yes
          elif [ "$ODD_DAY" = 1 ]; then
            python campaign_post.py focus --profile senang-homes --next --yes
          else
            python daily_posts.py --profile senang-homes --count 1 \
              --exclude-project "Khaya Residences" --exclude-project "One Seputeh Residence" --yes
          fi
      - name: Save posting history
        # Runs even if a platform failed, so whatever DID post is remembered and not reposted.
        if: always()
        run: |
          git add agents/hulk/scripts/state/senang-homes-posted.json
          git diff --cached --quiet && exit 0
          git commit -m "hulk: senang-homes posting history"
          git pull --rebase origin main
          git push origin HEAD:main
