<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #1e1b4b 0%, #7c3aed 55%, #f472b6 100%);
      }
      #title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 140px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="title" class="clip" data-start="0" data-duration="3" data-track-index="1">hi Sri</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { opacity: 0, scale: 0, duration: 0.9, ease: "elastic.out(1, 0.5)" }, 0.15);
      tl.set("#title", { scale: 1, opacity: 1 }, 3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
